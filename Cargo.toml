[package]
name = "lumen"
version = "0.5.3"
license = "MIT"
edition = "2024"

[dependencies]
arboard = "3.7.0"
calamine = "0.38.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Shutdown"] }
