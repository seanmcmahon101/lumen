name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Test and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup update stable --no-self-update
          cargo +stable test --locked --release --target x86_64-pc-windows-msvc
          cargo +stable build --locked --release --target x86_64-pc-windows-msvc

      - name: Build installer
        run: |
          $version = (cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match Cargo.toml' }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($iscc) { $iscc.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $compiler "/DAppVersion=$version" installer/lumen.iss

      - name: Check install and uninstall
        run: |
          $setup = Resolve-Path 'target/installer/Lumen-Setup-x64.exe'
          $install = Join-Path $env:LOCALAPPDATA 'Lumen'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Lumen.lnk'
          $setupArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $process = Start-Process $setup -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path "$install\lumen.exe") -or !(Test-Path $shortcut)) {
            throw 'Per-user installation failed'
          }
          $process = Start-Process "$install\unins000.exe" -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or (Test-Path "$install\lumen.exe") -or (Test-Path $shortcut)) {
            throw 'Per-user uninstall failed'
          }

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG target/installer/Lumen-Setup-x64.exe --verify-tag --title "Lumen $env:RELEASE_TAG" --generate-notes
