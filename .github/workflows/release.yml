name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.2.0)
        required: true

permissions:
  contents: write
  actions: read # lets SignPath read the uploaded artifact while signing

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Signing activates automatically once SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID are added as repository secrets.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Test and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup update stable --no-self-update
          cargo +stable test --locked --release --target x86_64-pc-windows-msvc
          cargo +stable build --locked --release --target x86_64-pc-windows-msvc

      - name: Build installer
        run: |
          $version = (cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match Cargo.toml' }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($iscc) { $iscc.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $compiler "/DAppVersion=$version" installer/lumen.iss
          # Lumen 0.4.2 and earlier only offer updates that include this fixed name.
          Copy-Item "target/installer/Lumen-Setup-$version-x64.exe" 'target/installer/Lumen-Setup-x64.exe'
          "SETUP=target/installer/Lumen-Setup-$version-x64.exe" >> $env:GITHUB_ENV

      - name: Check install, upgrade over a running Lumen, and uninstall
        run: |
          $setup = Resolve-Path $env:SETUP
          $built = Resolve-Path 'target/x86_64-pc-windows-msvc/release/lumen.exe'
          $install = Join-Path $env:LOCALAPPDATA 'Lumen'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Lumen.lnk'
          $setupArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # Stand in for a running Lumen with a long-lived lumen.exe that locks the installed file.
          function Start-RunningLumen {
            Copy-Item "$env:SystemRoot\System32\PING.EXE" "$install\lumen.exe" -Force
            Start-Process "$install\lumen.exe" -ArgumentList '-n', '600', '127.0.0.1' -WindowStyle Hidden
            Start-Sleep -Seconds 1
            if (!(Get-Process lumen -ErrorAction SilentlyContinue)) { throw 'Stand-in lumen.exe did not start' }
          }
          $process = Start-Process $setup -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path "$install\lumen.exe") -or !(Test-Path $shortcut)) {
            throw 'Per-user installation failed'
          }
          Start-RunningLumen
          $process = Start-Process $setup -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or (Get-Process lumen -ErrorAction SilentlyContinue) -or
              (Get-FileHash "$install\lumen.exe").Hash -ne (Get-FileHash $built).Hash) {
            throw 'Upgrade over a running Lumen failed'
          }
          Start-RunningLumen
          $process = Start-Process "$install\unins000.exe" -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or (Test-Path "$install\lumen.exe") -or (Test-Path $shortcut)) {
            throw 'Per-user uninstall failed'
          }

      # SignPath Foundation signs the installer on their HSM free of charge for
      # OSS. Portal setup must match these slugs: project "lumen", signing
      # policy "release-signing", and an artifact configuration whose root is
      # <zip-file> (upload-artifact zips the file) containing one .exe entry.
      - name: Upload installer for signing
        id: upload-unsigned-artifact
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lumen-installer-unsigned
          path: ${{ env.SETUP }}

      - name: Submit signing request to SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'lumen'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          output-artifact-directory: ${{ github.workspace }}/target/installer/signed

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versioned = Resolve-Path $env:SETUP
          # SignPath (upstream step) extracts the signed installer here.
          $signed = Join-Path 'target/installer/signed' (Split-Path $versioned -Leaf)
          $setup = if (Test-Path $signed) {
            Write-Host 'Publishing the SignPath-signed installer.'
            (Resolve-Path $signed).Path
          } else {
            Write-Host 'No SignPath secrets configured; publishing unsigned installer.'
            $versioned.Path
          }
          # The fixed-name asset serves updates offered by Lumen 0.4.2 and earlier.
          Copy-Item $setup 'target/installer/Lumen-Setup-x64.exe' -Force
          gh release create $env:RELEASE_TAG $setup 'target/installer/Lumen-Setup-x64.exe' --verify-tag --title "Lumen $env:RELEASE_TAG" --generate-notes
